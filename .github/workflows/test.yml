name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run public validator unit tests
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v
      - name: Run pipeline unit tests
        run: python3 -m unittest discover -s pipeline/tests/python -p 'test_*.py' -v
